<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
  <title>Resume Forge - Professional ATS-Optimized Resume Builder</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts - Space Grotesk & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.0/font/bootstrap-icons.css" />

  <!-- Bootstrap Bundle (for accordion / existing components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Puter.js — free unlimited AI via OpenAI models -->
  <script src="https://js.puter.com/v2/"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7V89K90ZXG"></script>

  <style>
    /* Font defaults for Tailwind @layer base */
    @layer base {
      * {
        font-family: 'Inter', sans-serif;
      }

      h1, h2, h3, h4, h5, h6, .brand-font {
        font-family: 'Space Grotesk', sans-serif;
      }
    }

    /* Print Styles */
    @media print {
      body * {
        visibility: hidden;
      }

      #resume-preview,
      #resume-preview * {
        visibility: visible;
      }

      #resume-preview {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .skills2 {
        background-color: #999;
      }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>We're sorry but Resume Forge doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>

  <div id="app"></div>

  <!-- Google Analytics -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7V89K90ZXG');
  </script>
</body>

</html>
